[app]
name = CryptoWatch

[kafka]
bootstrap_servers = localhost:9092
bootstrap_servers_internal = kafka:29092
topic = crypto-prices


[spark]
ingestion_app_name = KafkaCryptoConsumer
analytics_app_name = CryptoMetricsCalculator
output_path = file:/workspace/dataframes
checkpoint_path = file:/workspace/checkpoints
processing_time = 30 seconds

[postgres]
host = postgres
port = 5432
database = crypto_metrics
user = postgres
driver = org.postgresql.Driver

[analytics]
main_table = crypto_table
gainers_table = top_5_gainers
losers_table = top_5_losers
lookback_minutes = 7
run_interval_seconds = 360

[coingecko]
url = https://api.coingecko.com/api/v3/coins/markets
vs_currency = usd
ids = bitcoin,ethereum,solana,cardano,ripple,dogecoin,polkadot,binancecoin,avalanche,chainlink,polygon,cosmos,uniswap,litecoin,stellar,vechain,shiba-inu,tron,tezos,neo
order = market_cap_desc
per_page = 20
page = 1
sparkline = false
price_change_percentage = 24h